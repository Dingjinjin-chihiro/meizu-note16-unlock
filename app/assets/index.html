<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>魅族冻结助手</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1d2129; --line:#262b35;
    --txt:#e8eaed; --dim:#8b93a1; --acc:#4f8cff; --ok:#33c47a; --warn:#ff5c5c; --chip:#242a35;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;}
  .wrap{padding:14px 12px 90px}
  h1{font-size:20px;margin:0 0 2px;letter-spacing:.5px}
  .sub{font-size:12px;color:var(--dim);margin-bottom:12px}
  .sub b{color:var(--ok)}
  .search{display:flex;gap:8px;margin-bottom:10px}
  input[type=text]{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
  input[type=text]:focus{border-color:var(--acc)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
  .chip{flex:0 0 auto;background:var(--chip);color:var(--dim);border:1px solid var(--line);
    padding:6px 12px;border-radius:999px;font-size:12px}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .bar{display:flex;gap:8px;margin:8px 0 12px}
  .btn{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:11px 4px;font-size:12px;text-align:center}
  .btn:active{background:#2a3140}
  .btn.red{color:var(--warn);border-color:#4a2830}
  .btn.green{color:var(--ok);border-color:#22452f}
  .list{display:flex;flex-direction:column;gap:6px}
  .row{display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .row .info{flex:1;min-width:0}
  .row .name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .pkg{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sw{position:relative;width:46px;height:26px;flex:0 0 auto}
  .sw input{display:none}
  .sw span{position:absolute;inset:0;background:#2b3140;border-radius:999px;transition:.18s}
  .sw span:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;
    background:#fff;top:3px;left:3px;transition:.18s}
  .sw input:checked + span{background:var(--ok)}
  .sw input:checked + span:after{transform:translateX(20px)}
  .empty{text-align:center;color:var(--dim);font-size:13px;padding:40px 0}
  .fab{position:fixed;right:14px;bottom:16px;background:var(--acc);color:#fff;border:none;
    border-radius:50%;width:52px;height:52px;font-size:20px;box-shadow:0 6px 18px rgba(79,140,255,.4)}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:9}
  .mask.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;
    padding:16px;z-index:10;transform:translateY(110%);transition:.22s}
  .sheet.on{transform:translateY(0)}
  .sheet h3{margin:0 0 8px;font-size:15px}
  .sheet textarea{width:100%;height:180px;background:#0b0d11;color:var(--txt);
    border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;
    font-family:ui-monospace,monospace;resize:none;outline:none}
  .sheet .row2{display:flex;gap:8px;margin-top:10px}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
    background:#2a3140;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;
    opacity:0;transition:.2s;pointer-events:none;max-width:80%;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .spinner{text-align:center;color:var(--dim);padding:30px 0;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>魅族冻结助手</h1>
  <div class="sub" id="sub">正在读取…</div>

  <div class="search">
    <input type="text" id="q" placeholder="搜索应用名或包名" autocomplete="off">
  </div>

  <div class="chips" id="chips">
    <div class="chip on" data-f="all">全部</div>
    <div class="chip" data-f="frozen">已冻结</div>
    <div class="chip" data-f="enabled">已启用</div>
    <div class="chip" data-f="third">第三方</div>
    <div class="chip" data-f="system">系统</div>
  </div>

  <div class="bar">
    <div class="btn red" id="freezeAll">全部冻结</div>
    <div class="btn green" id="unfreezeAll">全部解冻</div>
  </div>
  <div class="bar" style="margin-top:-4px">
    <div class="btn" id="importBtn">导入列表</div>
    <div class="btn" id="exportBtn">导出冻结</div>
    <div class="btn" id="refreshBtn">刷新</div>
  </div>

  <div class="list" id="list"><div class="spinner">加载中…</div></div>
</div>

<div class="fab" id="fab">⟳</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <h3>导入包名列表</h3>
  <div class="sub">每行一个包名，支持 # 注释；也可以直接粘一整段文本。</div>
  <textarea id="ta" placeholder="com.meizu.flyme.weather&#10;com.meizu.media.music&#10;# 注释会被忽略"></textarea>
  <div class="row2">
    <div class="btn" id="cancelImport">取消</div>
    <div class="btn red" id="doImport">冻结这些应用</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var ALL = [], FILTER = 'all', Q = '', BUSY = false;

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('on'); }, 1800);
}
function esc(s){ return (s||'').replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function load(){
  document.getElementById('list').innerHTML = '<div class="spinner">加载中…</div>';
  try {
    ALL = JSON.parse(Native.listApps());
  } catch(e) {
    document.getElementById('sub').textContent = '读取失败：' + e;
    return;
  }
  render();
}

function render(){
  var frozen = ALL.filter(function(a){ return a.f; }).length;
  document.getElementById('sub').innerHTML =
    '共 <b>' + ALL.length + '</b> 个应用　已冻结 <b>' + frozen + '</b> 个';

  var out = ALL.filter(function(a){
    if (Q && a.l.toLowerCase().indexOf(Q) < 0 && a.p.toLowerCase().indexOf(Q) < 0) return false;
    if (FILTER === 'frozen') return a.f;
    if (FILTER === 'enabled') return !a.f;
    if (FILTER === 'third') return !a.s;
    if (FILTER === 'system') return a.s;
    return true;
  });

  if (!out.length){ document.getElementById('list').innerHTML = '<div class="empty">没有匹配的应用</div>'; return; }

  var html = '';
  for (var i=0;i<out.length;i++){
    var a = out[i];
    html += '<div class="row" data-p="' + esc(a.p) + '">'
         +  '<div class="info"><div class="name">' + esc(a.l) + '</div>'
         +  '<div class="pkg">' + esc(a.p) + '</div></div>'
         +  '<label class="sw"><input type="checkbox" ' + (a.f?'checked':'') + '>'
         +  '<span></span></label></div>';
  }
  document.getElementById('list').innerHTML = html;

  var boxes = document.querySelectorAll('#list .sw input');
  for (var k=0;k<boxes.length;k++){
    boxes[k].addEventListener('change', function(ev){
      var row = ev.target.closest('.row');
      var pkg = row.getAttribute('data-p');
      var want = ev.target.checked;
      var ok = Native.setFrozen(pkg, want) === '1';
      if (!ok){ ev.target.checked = !want; toast('操作失败'); return; }
      for (var j=0;j<ALL.length;j++){ if (ALL[j].p === pkg) ALL[j].f = want; }
      updateSub();
      toast((want?'已冻结 ':'已解冻 ') + pkg);
      if (FILTER === 'frozen' || FILTER === 'enabled') setTimeout(render, 250);
    });
  }
}

function updateSub(){
  var frozen = ALL.filter(function(a){ return a.f; }).length;
  document.getElementById('sub').innerHTML =
    '共 <b>' + ALL.length + '</b> 个应用　已冻结 <b>' + frozen + '</b> 个';
}

function visiblePkgs(){
  return Array.prototype.map.call(document.querySelectorAll('#list .row'),
    function(r){ return r.getAttribute('data-p'); });
}

function batch(freeze){
  if (BUSY) return;
  var pkgs = visiblePkgs().filter(function(p){
    for (var i=0;i<ALL.length;i++) if (ALL[i].p===p) return freeze ? !ALL[i].f : ALL[i].f;
    return false;
  });
  if (!pkgs.length){ toast('没有需要处理的应用'); return; }
  if (!confirm((freeze?'冻结':'解冻') + '当前列表的 ' + pkgs.length + ' 个应用？')) return;
  BUSY = true;
  var n = parseInt(Native.batch(JSON.stringify(pkgs), freeze), 10) || 0;
  BUSY = false;
  for (var i=0;i<ALL.length;i++) if (pkgs.indexOf(ALL[i].p) >= 0) ALL[i].f = freeze;
  render();
  toast('已' + (freeze?'冻结':'解冻') + ' ' + n + ' 个');
}

document.getElementById('q').addEventListener('input', function(e){
  Q = e.target.value.trim().toLowerCase(); render();
});

document.getElementById('chips').addEventListener('click', function(e){
  if (!e.target.classList.contains('chip')) return;
  var chips = document.querySelectorAll('.chip');
  for (var i=0;i<chips.length;i++) chips[i].classList.remove('on');
  e.target.classList.add('on');
  FILTER = e.target.getAttribute('data-f');
  render();
});

document.getElementById('freezeAll').onclick = function(){ batch(true); };
document.getElementById('unfreezeAll').onclick = function(){ batch(false); };
document.getElementById('refreshBtn').onclick = load;
document.getElementById('fab').onclick = load;

document.getElementById('importBtn').onclick = function(){
  document.getElementById('mask').classList.add('on');
  document.getElementById('sheet').classList.add('on');
};
document.getElementById('cancelImport').onclick = closeSheet;
document.getElementById('mask').onclick = closeSheet;
function closeSheet(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}

document.getElementById('doImport').onclick = function(){
  var text = document.getElementById('ta').value || '';
  var r;
  try { r = JSON.parse(Native.applyList(text)); }
  catch(e){ toast('导入失败：' + e); return; }
  closeSheet();
  toast('已冻结 ' + r.ok + ' 个（跳过 ' + r.skip + ' 个）');
  load();
};

document.getElementById('exportBtn').onclick = function(){
  var p;
  try { p = Native.exportFrozen(); } catch(e){ toast('导出失败'); return; }
  toast('已导出到 ' + p);
};

load();
</script>
</body>
</html>
