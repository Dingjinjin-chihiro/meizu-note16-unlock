<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>魅族冻结助手</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1d2129; --line:#262b35;
    --txt:#e8eaed; --dim:#8b93a1; --acc:#4f8cff; --ok:#33c47a; --warn:#ff5c5c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;}

  .app{height:100%;display:flex;flex-direction:column}

  /* ===== 固定头部：不随列表滚动 ===== */
  .hdr{flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--line);
       padding:12px 12px 8px}
  .titlerow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  h1{font-size:19px;margin:0;letter-spacing:.5px}
  .sub{font-size:11px;color:var(--dim)}
  .sub b{color:var(--ok)}
  input[type=text]{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:9px 12px;font-size:14px;outline:none;margin-bottom:8px}
  input[type=text]:focus{border-color:var(--acc)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--card2);color:var(--dim);border:1px solid var(--line);
    padding:5px 12px;border-radius:999px;font-size:12px}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .tools{display:flex;gap:6px}
  .tool{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:8px 2px;font-size:12px;text-align:center}
  .tool:active{background:#2a3140}

  /* ===== 可滚动区域：只有应用列表 ===== */
  .listwrap{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:10px 12px 130px}
  .list{display:flex;flex-direction:column;gap:6px}
  .row{display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:11px 12px;transition:.12s}
  .row.sel{border-color:var(--acc);background:#16213a}
  .box{width:22px;height:22px;flex:0 0 auto;border:2px solid #4a5262;border-radius:6px;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
  .row.sel .box{background:var(--acc);border-color:var(--acc);color:#fff}
  .info{flex:1;min-width:0}
  .name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pkg{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{flex:0 0 auto;font-size:11px;padding:3px 8px;border-radius:999px}
  .badge.f{background:#3a1f26;color:#ff7b7b}
  .badge.e{background:#16311f;color:#4ad98a}
  .empty,.spinner{text-align:center;color:var(--dim);font-size:13px;padding:36px 0}

  /* ===== 底部操作栏：选中后才出现 ===== */
  .actionbar{position:fixed;left:0;right:0;bottom:0;background:#151922;
    border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    transform:translateY(110%);transition:.2s;z-index:5}
  .actionbar.on{transform:translateY(0)}
  .actionbar .cnt{font-size:12px;color:var(--dim);margin-bottom:8px}
  .actionbar .cnt b{color:var(--acc);font-size:14px}
  .abtns{display:flex;gap:8px}
  .abtn{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--txt);
    border-radius:10px;padding:12px 4px;font-size:13px;text-align:center}
  .abtn.red{color:#ff7b7b;border-color:#4a2830;background:#2a1a1f}
  .abtn.green{color:#4ad98a;border-color:#22452f;background:#132a1e}
  .abtn.ghost{flex:0 0 84px;color:var(--dim)}

  .mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:9}
  .mask.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;
    padding:16px;z-index:10;transform:translateY(110%);transition:.22s}
  .sheet.on{transform:translateY(0)}
  .sheet h3{margin:0 0 6px;font-size:15px}
  .sheet .hint{font-size:12px;color:var(--dim);margin-bottom:10px}
  .sheet textarea{width:100%;height:170px;background:#0b0d11;color:var(--txt);
    border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;
    font-family:ui-monospace,monospace;resize:none;outline:none}
  .sheet .row2{display:flex;gap:8px;margin-top:10px}
  .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);
    background:#2a3140;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;
    opacity:0;transition:.2s;pointer-events:none;max-width:80%;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">

  <!-- 固定不动的头部 -->
  <div class="hdr">
    <div class="titlerow">
      <h1>魅族冻结助手</h1>
      <div class="sub" id="sub">读取中…</div>
    </div>
    <input type="text" id="q" placeholder="按应用名或包名搜索" autocomplete="off">
    <div class="chips" id="chips">
      <div class="chip on" data-f="all">全部</div>
      <div class="chip" data-f="frozen">已冻结</div>
      <div class="chip" data-f="enabled">已启用</div>
      <div class="chip" data-f="third">第三方</div>
      <div class="chip" data-f="system">系统</div>
    </div>
    <div class="tools">
      <div class="tool" id="selAll">全选</div>
      <div class="tool" id="selNone">取消选择</div>
      <div class="tool" id="importBtn">导入</div>
      <div class="tool" id="exportBtn">导出</div>
      <div class="tool" id="refreshBtn">刷新</div>
    </div>
  </div>

  <!-- 只有这一块滚动 -->
  <div class="listwrap" id="listwrap">
    <div class="list" id="list"><div class="spinner">加载中…</div></div>
  </div>
</div>

<!-- 选中应用后才出现 -->
<div class="actionbar" id="actionbar">
  <div class="cnt">已选择 <b id="selCount">0</b> 个应用</div>
  <div class="abtns">
    <div class="abtn red" id="doFreeze">冻结</div>
    <div class="abtn green" id="doUnfreeze">解冻</div>
    <div class="abtn ghost" id="doClear">取消</div>
  </div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <h3>导入包名列表</h3>
  <div class="hint">每行一个包名，支持 # 注释；也可以整段粘贴。</div>
  <textarea id="ta" placeholder="com.meizu.flyme.weather&#10;com.meizu.media.music&#10;# 注释会被忽略"></textarea>
  <div class="row2">
    <div class="abtn ghost" id="cancelImport">取消</div>
    <div class="abtn red" id="doImport">冻结这些应用</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var ALL = [], FILTER = 'all', Q = '', SEL = {}, BUSY = false;

function toast(m){
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('on'); }, 1800);
}
function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function load(){
  document.getElementById('list').innerHTML = '<div class="spinner">加载中…</div>';
  try { ALL = JSON.parse(Native.listApps()); }
  catch(e){ document.getElementById('sub').textContent = '读取失败'; return; }
  SEL = {};
  render();
}

function filtered(){
  return ALL.filter(function(a){
    if (Q && a.l.toLowerCase().indexOf(Q) < 0 && a.p.toLowerCase().indexOf(Q) < 0) return false;
    if (FILTER === 'frozen') return a.f;
    if (FILTER === 'enabled') return !a.f;
    if (FILTER === 'third') return !a.s;
    if (FILTER === 'system') return a.s;
    return true;
  });
}

function render(){
  var out = filtered();
  var frozen = ALL.filter(function(a){ return a.f; }).length;
  document.getElementById('sub').innerHTML =
    '共 <b>' + ALL.length + '</b> / 冻结 <b>' + frozen + '</b>';

  if (!out.length){
    document.getElementById('list').innerHTML = '<div class="empty">没有匹配的应用</div>';
    updateBar(); return;
  }

  var html = '';
  for (var i=0;i<out.length;i++){
    var a = out[i], on = !!SEL[a.p];
    html += '<div class="row' + (on?' sel':'') + '" data-p="' + esc(a.p) + '">'
         +  '<div class="box">✓</div>'
         +  '<div class="info"><div class="name">' + esc(a.l) + '</div>'
         +  '<div class="pkg">' + esc(a.p) + '</div></div>'
         +  '<div class="badge ' + (a.f?'f':'e') + '">' + (a.f?'已冻结':'启用中') + '</div>'
         +  '</div>';
  }
  document.getElementById('list').innerHTML = html;

  var rows = document.querySelectorAll('#list .row');
  for (var k=0;k<rows.length;k++){
    rows[k].addEventListener('click', function(){
      var p = this.getAttribute('data-p');
      if (SEL[p]) delete SEL[p]; else SEL[p] = 1;
      this.classList.toggle('sel');
      updateBar();
    });
  }
  updateBar();
}

function selList(){
  var out = [];
  for (var p in SEL) if (SEL.hasOwnProperty(p)) out.push(p);
  return out;
}

function updateBar(){
  var n = selList().length;
  document.getElementById('selCount').textContent = n;
  var bar = document.getElementById('actionbar');
  if (n > 0) bar.classList.add('on'); else bar.classList.remove('on');
}

function runBatch(freeze){
  if (BUSY) return;
  var pkgs = selList();
  if (!pkgs.length){ toast('先选应用'); return; }
  var what = freeze ? '冻结' : '解冻';
  if (!confirm(what + '选中的 ' + pkgs.length + ' 个应用？')) return;
  BUSY = true;
  var n = parseInt(Native.batch(JSON.stringify(pkgs), freeze), 10) || 0;
  BUSY = false;
  for (var i=0;i<ALL.length;i++) if (SEL[ALL[i].p]) ALL[i].f = freeze;
  SEL = {};
  render();
  toast('已' + what + ' ' + n + ' 个');
}

document.getElementById('q').addEventListener('input', function(e){
  Q = e.target.value.trim().toLowerCase(); render();
});
document.getElementById('chips').addEventListener('click', function(e){
  if (!e.target.classList.contains('chip')) return;
  var cs = document.querySelectorAll('.chip');
  for (var i=0;i<cs.length;i++) cs[i].classList.remove('on');
  e.target.classList.add('on');
  FILTER = e.target.getAttribute('data-f');
  document.getElementById('listwrap').scrollTop = 0;
  render();
});
document.getElementById('selAll').onclick = function(){
  var out = filtered();
  for (var i=0;i<out.length;i++) SEL[out[i].p] = 1;
  render();
};
document.getElementById('selNone').onclick = function(){ SEL = {}; render(); };
document.getElementById('refreshBtn').onclick = load;
document.getElementById('doFreeze').onclick = function(){ runBatch(true); };
document.getElementById('doUnfreeze').onclick = function(){ runBatch(false); };
document.getElementById('doClear').onclick = function(){ SEL = {}; render(); };

document.getElementById('importBtn').onclick = function(){
  document.getElementById('mask').classList.add('on');
  document.getElementById('sheet').classList.add('on');
};
function closeSheet(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}
document.getElementById('mask').onclick = closeSheet;
document.getElementById('cancelImport').onclick = closeSheet;
document.getElementById('doImport').onclick = function(){
  var text = document.getElementById('ta').value || '';
  var r;
  try { r = JSON.parse(Native.applyList(text)); }
  catch(e){ toast('导入失败'); return; }
  closeSheet();
  document.getElementById('ta').value = '';
  toast('已冻结 ' + r.ok + ' 个（跳过 ' + r.skip + '）');
  load();
};
document.getElementById('exportBtn').onclick = function(){
  var p;
  try { p = Native.exportFrozen(); } catch(e){ toast('导出失败'); return; }
  toast('已导出到 ' + p);
};

load();
</script>
</body>
</html>
