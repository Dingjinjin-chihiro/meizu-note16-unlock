<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>魅族冻结助手</title>
<style>
  :root{
    --bg:#0B0D10; --card:#15181F; --card2:#1B1F27; --line:#23272F;
    --txt:#E9ECF1; --dim:#8791A1; --mute:#5C6675;
    --acc:#4C8DFF; --acc2:#6FA8FF; --ok:#3DD68C; --err:#FF5C5C;
    --dangerbg:#2A161A; --dangerline:#4A2830;
    --okbg:#10261B; --okline:#1E4A33;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}

  .app{height:100%;display:flex;flex-direction:column}

  /* ============ 头部 ============ */
  .hdr{flex:0 0 auto;background:linear-gradient(180deg,#101318 0%,var(--bg) 100%);
       border-bottom:1px solid var(--line);padding:14px 14px 10px}

  .titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{font-size:19px;font-weight:650;margin:0;letter-spacing:.3px;
     background:linear-gradient(92deg,#fff 0%,#A9C4F5 100%);
     -webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .stats{font-size:11.5px;color:var(--dim);margin:3px 0 10px;letter-spacing:.2px}
  .stats b{color:var(--txt);font-weight:600}
  .stats i{color:var(--err);font-style:normal;font-weight:600}

  .pill{flex:0 0 auto;font-size:11.5px;font-weight:500;color:#FF9AA5;
    border:1px solid var(--dangerline);background:var(--dangerbg);
    padding:6px 11px;border-radius:999px;transition:.15s}
  .pill:active{transform:scale(.95);background:#331A20}

  .searchbox{position:relative;margin-bottom:9px}
  .searchbox input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:12px;padding:11px 38px 11px 13px;font-size:14px;outline:none;transition:.15s}
  .searchbox input:focus{border-color:var(--acc);background:var(--card2);
    box-shadow:0 0 0 3px rgba(76,141,255,.12)}
  .searchbox input::placeholder{color:var(--mute)}
  .clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border-radius:50%;background:#2B313B;color:#B9C2CF;
    display:none;align-items:center;justify-content:center;font-size:13px;line-height:1}
  .clr.on{display:flex}

  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--card);color:var(--dim);border:1px solid var(--line);
    padding:6px 13px;border-radius:999px;font-size:12px;transition:.15s}
  .chip:active{transform:scale(.96)}
  .chip.on{background:linear-gradient(135deg,var(--acc) 0%,#3E7BEA 100%);
    border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(76,141,255,.32)}

  .tools{display:flex;gap:7px}
  .tool{flex:1;background:var(--card);border:1px solid var(--line);color:#C7CFDB;
    border-radius:10px;padding:9px 2px;font-size:12px;text-align:center;transition:.12s}
  .tool:active{transform:scale(.96);background:var(--card2);color:#fff}

  /* ============ 列表 ============ */
  .listwrap{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:11px 12px 132px}
  .list{display:flex;flex-direction:column;gap:7px}

  .row{display:flex;align-items:center;gap:11px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:10px 12px;transition:.13s;
    animation:pop .22s ease both}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .row:active{transform:scale(.992);background:var(--card2)}
  .row.sel{border-color:var(--acc);background:#141C2E;
    box-shadow:0 0 0 1px rgba(76,141,255,.45),0 4px 14px rgba(76,141,255,.12)}

  .box{width:21px;height:21px;flex:0 0 auto;border:2px solid #3E4653;border-radius:7px;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:.13s}
  .row.sel .box{background:var(--acc);border-color:var(--acc);color:#fff}

  .ico{width:42px;height:42px;flex:0 0 auto;border-radius:11px;background:#22262E;
    object-fit:contain;padding:0}

  .info{flex:1;min-width:0}
  .name{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    letter-spacing:.1px}
  .pkg{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-top:2px;font-family:ui-monospace,"Roboto Mono",monospace}

  .badge{flex:0 0 auto;font-size:10.5px;font-weight:500;padding:4px 8px;border-radius:8px;
    letter-spacing:.2px}
  .badge.f{background:var(--dangerbg);color:#FF8E99}
  .badge.e{background:var(--okbg);color:#57DE9C}

  /* 骨架屏 */
  .sk{display:flex;align-items:center;gap:11px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .sk .b{background:linear-gradient(90deg,#1C2028 25%,#252A34 50%,#1C2028 75%);
    background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px}
  .sk .b1{width:42px;height:42px;border-radius:11px}
  .sk .b2{width:58%;height:12px}
  .sk .b3{width:38%;height:10px;margin-top:6px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .empty{text-align:center;padding:56px 20px;color:var(--mute)}
  .empty .big{font-size:34px;opacity:.5;margin-bottom:10px}
  .empty .t{font-size:13px}

  /* ============ 底部操作栏 ============ */
  .actionbar{position:fixed;left:0;right:0;bottom:0;background:rgba(19,22,29,.97);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    transform:translateY(115%);transition:.22s cubic-bezier(.4,0,.2,1);z-index:5}
  .actionbar.on{transform:translateY(0)}
  .actionbar .cnt{font-size:12px;color:var(--dim);margin-bottom:9px;display:flex;
    align-items:center;justify-content:space-between}
  .actionbar .cnt b{color:var(--acc);font-size:15px;font-weight:650}
  .abtns{display:flex;gap:8px}
  .abtn{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--txt);
    border-radius:12px;padding:13px 4px;font-size:13.5px;font-weight:500;text-align:center;
    transition:.12s}
  .abtn:active{transform:scale(.96)}
  .abtn.red{color:#FF9AA5;border-color:var(--dangerline);background:var(--dangerbg)}
  .abtn.green{color:#63E3A3;border-color:var(--okline);background:var(--okbg)}
  .abtn.ghost{flex:0 0 82px;color:var(--dim);background:transparent}

  /* ============ 弹层 ============ */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px);
    display:none;z-index:9}
  .mask.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);
    border-radius:20px 20px 0 0;padding:18px;z-index:10;
    transform:translateY(115%);transition:.24s cubic-bezier(.4,0,.2,1);
    max-height:84%;overflow-y:auto;border-top:1px solid #2C313B}
  .sheet.on{transform:translateY(0)}
  .sheet h3{margin:0 0 3px;font-size:16px;font-weight:600}
  .sheet .hint{font-size:11.5px;color:var(--dim);margin-bottom:12px;word-break:break-all;
    font-family:ui-monospace,monospace}
  .sheet textarea{width:100%;height:160px;background:#0A0C10;color:var(--txt);
    border:1px solid var(--line);border-radius:12px;padding:11px;font-size:12px;
    font-family:ui-monospace,monospace;resize:none;outline:none;margin-top:8px}
  .sheet .row2{display:flex;gap:8px;margin-top:14px}

  .dhead{display:flex;gap:12px;align-items:center;margin-bottom:13px}
  .aico{width:48px;height:48px;border-radius:13px;flex:0 0 auto;
    background:linear-gradient(135deg,#2A3550,#1B2130);display:flex;align-items:center;
    justify-content:center;font-size:22px}
  .dico{width:48px;height:48px;border-radius:13px;background:#22262E;flex:0 0 auto}
  .kv{display:flex;flex-direction:column;gap:1px;background:var(--line);
    border-radius:12px;overflow:hidden}
  .kv .kvrow{display:flex;background:#191D24;padding:10px 12px;font-size:12.5px;gap:12px}
  .kv .k{color:var(--dim);flex:0 0 58px}
  .kv .v{flex:1;word-break:break-all;text-align:right;font-family:ui-monospace,monospace;
    font-size:12px}
  .kv .v.ok{color:#57DE9C;font-family:inherit}
  .kv .v.no{color:#FF8E99;font-family:inherit}

  .toast{position:fixed;left:50%;bottom:122px;transform:translateX(-50%) translateY(16px) scale(.96);
    background:#242A34;color:#fff;padding:11px 17px;border-radius:14px;font-size:13px;
    opacity:0;transition:.2s cubic-bezier(.4,0,.2,1);pointer-events:none;max-width:86%;
    text-align:center;border:1px solid #333B47;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:20}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  .toast.ok{background:#12301F;border-color:#27573C;color:#7BF0B4}
  .toast.err{background:#321A1E;border-color:#63303A;color:#FFAEb6}
  .toast.up{bottom:206px}
</style>
</head>
<body>
<div class="app">

  <div class="hdr">
    <div class="titlerow">
      <h1>魅族冻结助手</h1>
      <div class="pill" id="unfreezeAll">解冻全部</div>
    </div>
    <div class="stats" id="stats">读取中…</div>

    <div class="searchbox">
      <input type="text" id="q" placeholder="搜索应用名或包名" autocomplete="off">
      <div class="clr" id="qclr">✕</div>
    </div>

    <div class="chips" id="chips">
      <div class="chip on" data-f="all">全部</div>
      <div class="chip" data-f="frozen">已冻结</div>
      <div class="chip" data-f="enabled">已启用</div>
      <div class="chip" data-f="third">第三方</div>
      <div class="chip" data-f="system">系统</div>
    </div>

    <div class="tools">
      <div class="tool" id="selAll">全选</div>
      <div class="tool" id="selNone">取消</div>
      <div class="tool" id="sortBtn">排序</div>
      <div class="tool" id="importBtn">导入</div>
      <div class="tool" id="exportBtn">导出</div>
      <div class="tool" id="refreshBtn">刷新</div>
      <div class="tool" id="autoBtn">自动</div>
    </div>
  </div>

  <div class="listwrap" id="listwrap">
    <div class="list" id="list"></div>
  </div>
</div>

<div class="actionbar" id="actionbar">
  <div class="cnt"><span>已选择 <b id="selCount">0</b> 个应用</span><span id="selHint"></span></div>
  <div class="abtns">
    <div class="abtn red" id="doFreeze">冻结</div>
    <div class="abtn green" id="doUnfreeze">解冻</div>
    <div class="abtn ghost" id="doClear">取消</div>
  </div>
</div>

<div class="mask" id="mask"></div>

<div class="sheet" id="sheet">
  <h3>导入包名列表</h3>
  <div class="hint">每行一个包名，支持 # 注释</div>
  <textarea id="ta" placeholder="com.meizu.flyme.weather&#10;com.meizu.media.music&#10;# 注释会被忽略"></textarea>
  <div class="row2">
    <div class="abtn ghost" id="cancelImport">取消</div>
    <div class="abtn red" id="doImport">冻结这些应用</div>
  </div>
</div>

<div class="sheet" id="detail">
  <div class="dhead">
    <img class="dico" id="dIcon">
    <div style="min-width:0">
      <h3 id="dName">应用详情</h3>
      <div class="hint" id="dPkg" style="margin-bottom:0"></div>
    </div>
  </div>
  <div class="kv" id="dBody"></div>
  <div class="row2">
    <div class="abtn" id="dLaunch">打开</div>
    <div class="abtn red" id="dFreeze">冻结</div>
    <div class="abtn green" id="dUnfreeze">解冻</div>
    <div class="abtn ghost" id="dClose">关闭</div>
  </div>
</div>

<div class="sheet" id="auto">
  <div class="dhead">
    <div class="aico">⚡</div>
    <div style="min-width:0">
      <h3>自动冻结</h3>
      <div class="hint" style="margin-bottom:0">锁屏后冻结清单内的应用</div>
    </div>
  </div>
  <div class="kv" id="autoInfo"></div>
  <div class="row2">
    <div class="abtn" id="autoToggle">开启</div>
    <div class="abtn ghost" id="autoClose">关闭</div>
  </div>
  <div class="row2">
    <div class="abtn" id="autoAddSel">把选中加入清单</div>
    <div class="abtn red" id="autoClear">清空清单</div>
  </div>
  <div class="row2">
    <div class="abtn" id="autoRunNow">立即执行一次</div>
  </div>
  <div class="hint" style="margin-top:12px">仅在屏幕熄灭时执行；正在前台使用的应用会跳过，不会被冻掉。<br>若锁屏后没有生效，请到系统「权限管理 / 后台运行」里允许本应用后台运行。</div>
</div>

<div class="toast" id="toast"></div>

<script>
var ALL = [], FILTER = 'all', Q = '', SEL = {}, BUSY = false;
var SORT = 'name', SORTS = ['name','size','time'], SORTNAME = {name:'名称',size:'大小',time:'时间'};
var DETAIL_PKG = null, ICON_CACHE = {}, AUTO = {enabled:false, targets:[]};

function toast(m, kind){
  var t = document.getElementById('toast');
  t.className = 'toast';
  if (kind === 'ok') t.classList.add('ok');
  else if (kind === 'err') t.classList.add('err');
  if (document.getElementById('actionbar').classList.contains('on')) t.classList.add('up');
  t.textContent = m;
  void t.offsetWidth;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove('on'); }, 1900);
}
function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function fmtSize(b){
  if (b === undefined || b === null || b < 0) return '未知';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
  return (b/1073741824).toFixed(2) + ' GB';
}
function fmtTime(ms){
  if (!ms) return '未知';
  var d = new Date(ms);
  function p(n){ return n < 10 ? '0'+n : ''+n; }
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* 骨架屏 */
function skeleton(n){
  var h = '';
  for (var i=0;i<n;i++){
    h += '<div class="sk"><div class="b b1"></div>'
      +  '<div style="flex:1"><div class="b b2"></div><div class="b b3"></div></div></div>';
  }
  document.getElementById('list').innerHTML = h;
}

function load(){
  skeleton(7);
  document.getElementById('stats').textContent = '读取中…';
  setTimeout(function(){
    try { ALL = JSON.parse(Native.listApps()); }
    catch(e){ document.getElementById('stats').textContent = '读取失败'; return; }
    SEL = {};
    render();
    var frozen = ALL.filter(function(a){ return a.f; }).length;
    toast('已刷新：共 ' + ALL.length + ' 个，冻结 ' + frozen + ' 个');
  }, 30);
}

function filtered(){
  var out = ALL.filter(function(a){
    if (Q && a.l.toLowerCase().indexOf(Q) < 0 && a.p.toLowerCase().indexOf(Q) < 0) return false;
    if (FILTER === 'frozen') return a.f;
    if (FILTER === 'enabled') return !a.f;
    if (FILTER === 'third') return !a.s;
    if (FILTER === 'system') return a.s;
    return true;
  });
  if (SORT === 'size') out.sort(function(x,y){ return (y.z||0) - (x.z||0); });
  else if (SORT === 'time') out.sort(function(x,y){ return (y.t||0) - (x.t||0); });
  return out;
}

function render(){
  var out = filtered();
  var frozen = ALL.filter(function(a){ return a.f; }).length;
  document.getElementById('stats').innerHTML =
    '共 <b>' + ALL.length + '</b> 个应用　已冻结 <i>' + frozen + '</i> 个';

  if (!out.length){
    document.getElementById('list').innerHTML =
      '<div class="empty"><div class="big">🔍</div><div class="t">没有匹配的应用</div></div>';
    updateBar(); return;
  }

  var html = '';
  for (var i=0;i<out.length;i++){
    var a = out[i], on = !!SEL[a.p];
    var icon = ICON_CACHE[a.p] ? 'src="' + ICON_CACHE[a.p] + '"' : '';
    html += '<div class="row' + (on?' sel':'') + '" data-p="' + esc(a.p) + '">'
         +  '<div class="box">✓</div>'
         +  '<img class="ico" ' + icon + ' data-p="' + esc(a.p) + '">'
         +  '<div class="info"><div class="name">' + esc(a.l) + '</div>'
         +  '<div class="pkg">' + esc(a.p) + '</div></div>'
         +  '<div class="badge ' + (a.f?'f':'e') + '">' + (a.f?'已冻结':'启用中') + '</div>'
         +  '</div>';
  }
  document.getElementById('list').innerHTML = html;

  var rows = document.querySelectorAll('#list .row');
  for (var k=0;k<rows.length;k++) bindRow(rows[k]);
  updateBar();
  loadIcons();
}

/* 图标分批加载，避免卡顿 */
function loadIcons(){
  var imgs = document.querySelectorAll('#list img.ico:not([src])');
  var i = 0;
  function step(){
    var end = Math.min(i + 14, imgs.length);
    for (; i<end; i++){
      var p = imgs[i].getAttribute('data-p');
      try {
        var u = ICON_CACHE[p] || Native.iconFor(p);
        if (u){ ICON_CACHE[p] = u; imgs[i].src = u; }
      } catch(e){}
    }
    if (i < imgs.length) setTimeout(step, 12);
  }
  step();
}

/* 短按=选中，长按=详情 */
function bindRow(row){
  var pkg = row.getAttribute('data-p');
  var timer = null, longPressed = false;

  function start(){
    longPressed = false;
    timer = setTimeout(function(){
      longPressed = true;
      if (navigator.vibrate) navigator.vibrate(14);
      openDetail(pkg);
    }, 460);
  }
  function cancel(){ if (timer){ clearTimeout(timer); timer = null; } }

  row.addEventListener('touchstart', start);
  row.addEventListener('touchend', cancel);
  row.addEventListener('touchmove', cancel);
  row.addEventListener('touchcancel', cancel);

  row.addEventListener('click', function(){
    if (longPressed){ longPressed = false; return; }
    var nm = this.querySelector('.name').textContent;
    var on;
    if (SEL[pkg]) { delete SEL[pkg]; on = false; } else { SEL[pkg] = 1; on = true; }
    this.classList.toggle('sel');
    updateBar();
    var n = selList().length;
    toast((on ? '已选中 ' : '已取消 ') + nm + (n ? '　共 ' + n + ' 个' : ''), on ? 'ok' : null);
  });
}

function selList(){
  var out = [];
  for (var p in SEL) if (SEL.hasOwnProperty(p)) out.push(p);
  return out;
}

function updateBar(){
  var n = selList().length;
  document.getElementById('selCount').textContent = n;
  var hint = document.getElementById('selHint');
  if (n){
    var f = 0, e = 0;
    for (var p in SEL) if (SEL.hasOwnProperty(p)){
      for (var i=0;i<ALL.length;i++) if (ALL[i].p === p){ if (ALL[i].f) f++; else e++; break; }
    }
    hint.textContent = '冻结 ' + f + ' · 启用 ' + e;
  } else hint.textContent = '';
  var bar = document.getElementById('actionbar');
  if (n > 0) bar.classList.add('on'); else bar.classList.remove('on');
}

function markFrozen(pkgs, freeze){
  for (var i=0;i<ALL.length;i++) if (pkgs.indexOf(ALL[i].p) >= 0) ALL[i].f = freeze;
}

function runBatch(freeze){
  if (BUSY) return;
  var pkgs = selList();
  if (!pkgs.length){ toast('先选应用', 'err'); return; }
  var what = freeze ? '冻结' : '解冻';
  if (!confirm(what + '选中的 ' + pkgs.length + ' 个应用？')) return;
  BUSY = true;
  toast('正在' + what + ' ' + pkgs.length + ' 个…');
  var n = parseInt(Native.batch(JSON.stringify(pkgs), freeze), 10) || 0;
  BUSY = false;
  markFrozen(pkgs, freeze);
  SEL = {};
  render();
  if (n >= pkgs.length) toast('已' + what + ' ' + n + ' 个', 'ok');
  else if (n === 0) toast(what + '失败，请检查 root 授权', 'err');
  else toast('部分' + what + '：成功 ' + n + ' / ' + pkgs.length, 'err');
}

/* ===== 应用详情 ===== */
function openDetail(pkg){
  var d;
  try { d = JSON.parse(Native.appDetail(pkg)); }
  catch(e){ toast('读取详情失败', 'err'); return; }
  if (!d || !d.pkg){ toast('读取详情失败', 'err'); return; }
  DETAIL_PKG = pkg;

  document.getElementById('dName').textContent = d.label;
  document.getElementById('dPkg').textContent = d.pkg;
  try {
    var iu = ICON_CACHE[pkg] || Native.iconFor(pkg);
    if (iu){ ICON_CACHE[pkg] = iu; document.getElementById('dIcon').src = iu; }
  } catch(e){}

  function row(k, v, cls){
    return '<div class="kvrow"><div class="k">' + k + '</div><div class="v ' + (cls||'') + '">' + v + '</div></div>';
  }
  var html = '';
  html += row('状态', d.frozen ? '已冻结' : '启用中', d.frozen ? 'no' : 'ok');
  html += row('运行', d.running ? ('运行中 pid ' + d.pid) : '未运行', d.running ? 'ok' : '');
  html += row('类型', d.sys ? '系统应用' : '第三方应用');
  html += row('版本', d.ver + ' (' + d.vcode + ')');
  html += row('UID', d.uid);
  html += row('SDK', 'min ' + d.min + ' / target ' + d.target);
  html += row('APK', fmtSize(d.apkSize));
  html += row('数据', d.dataKb >= 0 ? fmtSize(d.dataKb * 1024) : '无数据目录');
  html += row('安装', fmtTime(d.install));
  html += row('更新', fmtTime(d.update));
  html += '<div class="kvrow"><div class="k">路径</div><div class="v" style="font-size:10px;text-align:left">' + esc(d.apk) + '</div></div>';
  document.getElementById('dBody').innerHTML = html;

  document.getElementById('dLaunch').style.display = (d.launch === '可启动') ? '' : 'none';
  document.getElementById('dFreeze').style.display = d.frozen ? 'none' : '';
  document.getElementById('dUnfreeze').style.display = d.frozen ? '' : 'none';

  document.getElementById('mask').classList.add('on');
  document.getElementById('detail').classList.add('on');
}

function closeDetail(){
  document.getElementById('detail').classList.remove('on');
  if (!document.getElementById('sheet').classList.contains('on'))
    document.getElementById('mask').classList.remove('on');
  DETAIL_PKG = null;
}

function detailAction(freeze){
  var pkg = DETAIL_PKG;
  if (!pkg) return;
  var n = parseInt(Native.batch(JSON.stringify([pkg]), freeze), 10) || 0;
  if (n > 0){
    markFrozen([pkg], freeze);
    render();
    toast('已' + (freeze ? '冻结 ' : '解冻 ') + pkg, 'ok');
  } else {
    toast((freeze ? '冻结' : '解冻') + '失败', 'err');
  }
  closeDetail();
}

/* ===== 自动冻结 ===== */
function openAuto(){
  try { AUTO = JSON.parse(Native.autoStatus()); } catch(e){ AUTO = {enabled:false, targets:[]}; }
  renderAuto();
  document.getElementById('mask').classList.add('on');
  document.getElementById('auto').classList.add('on');
}
function closeAuto(){
  document.getElementById('auto').classList.remove('on');
  if (!document.getElementById('detail').classList.contains('on')
   && !document.getElementById('sheet').classList.contains('on'))
    document.getElementById('mask').classList.remove('on');
}
function renderAuto(){
  var n = (AUTO.targets || []).length;
  var last = AUTO.last ? fmtTime(AUTO.last) + '（' + (AUTO.lastCount||0) + ' 个）' : '还没执行过';
  var html = ''
    + '<div class="kvrow"><div class="k">状态</div><div class="v ' + (AUTO.enabled?'ok':'') + '">'
    + (AUTO.enabled ? '运行中' : '已关闭') + '</div></div>'
    + '<div class="kvrow"><div class="k">清单</div><div class="v">' + n + ' 个应用</div></div>'
    + '<div class="kvrow"><div class="k">上次</div><div class="v" style="font-family:inherit">' + last + '</div></div>';
  document.getElementById('autoInfo').innerHTML = html;
  document.getElementById('autoToggle').textContent = AUTO.enabled ? '关闭自动冻结' : '开启自动冻结';
  document.getElementById('autoToggle').className = AUTO.enabled ? 'abtn red' : 'abtn green';
}

/* ===== 事件 ===== */
var q = document.getElementById('q');
q.addEventListener('input', function(){
  Q = q.value.trim().toLowerCase();
  document.getElementById('qclr').classList.toggle('on', !!Q);
  render();
  clearTimeout(window._st);
  window._st = setTimeout(function(){
    if (!Q) { toast('已清除搜索'); return; }
    var n = filtered().length;
    if (n) toast('搜索「' + Q + '」：' + n + ' 个匹配');
    else toast('没有匹配「' + Q + '」的应用', 'err');
  }, 400);
});
document.getElementById('qclr').onclick = function(){
  q.value = ''; Q = '';
  this.classList.remove('on');
  render();
  toast('已清除搜索');
};

document.getElementById('chips').addEventListener('click', function(e){
  if (!e.target.classList.contains('chip')) return;
  var cs = document.querySelectorAll('.chip');
  for (var i=0;i<cs.length;i++) cs[i].classList.remove('on');
  e.target.classList.add('on');
  FILTER = e.target.getAttribute('data-f');
  document.getElementById('listwrap').scrollTop = 0;
  render();
  var names = {all:'全部应用', frozen:'只看已冻结', enabled:'只看已启用',
               third:'只看第三方', system:'只看系统'};
  toast(names[FILTER] + '：' + filtered().length + ' 个');
});

document.getElementById('selAll').onclick = function(){
  var out = filtered();
  if (!out.length){ toast('当前列表是空的', 'err'); return; }
  for (var i=0;i<out.length;i++) SEL[out[i].p] = 1;
  render();
  toast('已全选 ' + out.length + ' 个应用', 'ok');
};
document.getElementById('selNone').onclick = function(){
  var n = selList().length;
  SEL = {}; render();
  toast(n ? '已取消 ' + n + ' 个选择' : '当前没有选中项');
};
document.getElementById('sortBtn').onclick = function(){
  var i = SORTS.indexOf(SORT);
  SORT = SORTS[(i+1) % SORTS.length];
  document.getElementById('sortBtn').textContent = '排序:' + SORTNAME[SORT];
  document.getElementById('listwrap').scrollTop = 0;
  render();
  toast('按' + SORTNAME[SORT] + '排序');
};
document.getElementById('refreshBtn').onclick = load;

document.getElementById('unfreezeAll').onclick = function(){
  var pkgs = ALL.filter(function(a){ return a.f; }).map(function(a){ return a.p; });
  if (!pkgs.length){ toast('当前没有已冻结的应用', 'err'); return; }
  if (!confirm('解冻全部 ' + pkgs.length + ' 个已冻结应用？')) return;
  toast('正在解冻 ' + pkgs.length + ' 个…');
  var n = parseInt(Native.batch(JSON.stringify(pkgs), false), 10) || 0;
  markFrozen(pkgs, false);
  render();
  toast(n >= pkgs.length ? '已全部解冻 ' + n + ' 个' : '部分解冻：成功 ' + n + ' / ' + pkgs.length,
        n >= pkgs.length ? 'ok' : 'err');
};

document.getElementById('doFreeze').onclick = function(){ runBatch(true); };
document.getElementById('doUnfreeze').onclick = function(){ runBatch(false); };
document.getElementById('doClear').onclick = function(){ SEL = {}; render(); toast('已取消选择'); };

document.getElementById('mask').onclick = function(){ closeSheet(); closeDetail(); closeAuto(); };
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  if (!document.getElementById('detail').classList.contains('on'))
    document.getElementById('mask').classList.remove('on');
}

document.getElementById('importBtn').onclick = function(){
  document.getElementById('mask').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  toast('每行一个包名，粘贴后点「冻结这些应用」');
};
document.getElementById('cancelImport').onclick = function(){ closeSheet(); };
document.getElementById('doImport').onclick = function(){
  var text = document.getElementById('ta').value || '';
  if (!text.trim()){ toast('先粘贴包名列表', 'err'); return; }
  var r;
  try { r = JSON.parse(Native.applyList(text)); }
  catch(e){ toast('导入失败：格式有误', 'err'); return; }
  closeSheet();
  document.getElementById('ta').value = '';
  if (r.ok > 0) toast('已冻结 ' + r.ok + ' 个' + (r.skip ? '，跳过 ' + r.skip + ' 个' : ''), 'ok');
  else toast('没有可冻结的应用（跳过 ' + r.skip + ' 个）', 'err');
  load();
};

document.getElementById('exportBtn').onclick = function(){
  var p;
  try { p = Native.exportFrozen(); } catch(e){ toast('导出失败', 'err'); return; }
  if (p.indexOf('ERR:') === 0){ toast('导出失败：' + p.substring(4), 'err'); return; }
  toast('已导出到 ' + p.substring(p.lastIndexOf('/')+1) + '（应用目录下）', 'ok');
};

document.getElementById('autoBtn').onclick = openAuto;
document.getElementById('autoClose').onclick = closeAuto;
document.getElementById('autoToggle').onclick = function(){
  var on = !AUTO.enabled;
  Native.autoEnable(on);
  AUTO.enabled = on;
  renderAuto();
  toast(on ? '自动冻结已开启，锁屏后生效' : '已关闭自动冻结', on ? 'ok' : null);
};
document.getElementById('autoAddSel').onclick = function(){
  var sel = selList();
  if (!sel.length){ toast('先在列表里勾选应用', 'err'); return; }
  var cur = (AUTO.targets || []).slice();
  var added = 0;
  for (var i=0;i<sel.length;i++) if (cur.indexOf(sel[i]) < 0){ cur.push(sel[i]); added++; }
  Native.autoSetTargets(JSON.stringify(cur));
  AUTO.targets = cur;
  renderAuto();
  toast('已加入 ' + added + ' 个，清单共 ' + cur.length + ' 个', 'ok');
};
document.getElementById('autoRunNow').onclick = function(){
  if (!(AUTO.targets||[]).length){ toast('清单是空的', 'err'); return; }
  Native.autoRunNow();
  toast('已触发，稍后刷新查看结果');
  setTimeout(function(){ openAuto(); load(); }, 2500);
};
document.getElementById('autoClear').onclick = function(){
  var n = (AUTO.targets||[]).length;
  if (!n){ toast('清单已经是空的', 'err'); return; }
  if (!confirm('清空自动冻结清单（' + n + ' 个）？')) return;
  Native.autoSetTargets('[]');
  AUTO.targets = [];
  renderAuto();
  toast('清单已清空', 'ok');
};

document.getElementById('dClose').onclick = closeDetail;
document.getElementById('dFreeze').onclick = function(){ detailAction(true); };
document.getElementById('dUnfreeze').onclick = function(){ detailAction(false); };
document.getElementById('dLaunch').onclick = function(){
  if (!DETAIL_PKG) return;
  var ok = Native.launchApp(DETAIL_PKG) === '1';
  if (ok){ toast('正在打开…', 'ok'); closeDetail(); }
  else toast('这个应用没有可启动的界面', 'err');
};

skeleton(7);
load();
</script>
</body>
</html>
